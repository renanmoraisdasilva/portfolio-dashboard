name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs so private-repo minutes are not wasted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scan's most important check is whether a path
          # like `*.db` or `.env` was EVER committed, which means walking every
          # commit reachable from every ref. At the default shallow clone the
          # runner has one commit, so that check silently inspected nothing and
          # reported "never committed" for all fourteen patterns. The repository
          # has a remote now, so the full history is available; it was pinned
          # shallow back when there was not one. Local verification: 376 commits
          # across 8 refs, zero forbidden paths, so this cannot turn the job red.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A PR cannot merge with an unused import or a stray semicolon.
      - run: npm run lint
      - run: npm run format:check
      - run: npm run scan:secrets
      # Any severity fails the build. The tree is currently at 0, and the one
      # finding that needed an override to get there (esbuild, via drizzle-kit)
      # is documented in AGENTS.md together with the `npm dedupe` step that
      # actually applies it - a lockfile that silently reintroduces the nested
      # copy would otherwise turn this red for a reason nobody could see.
      - run: npm run audit

  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # After a build, so the seam test can assert against apps/web/dist.
      - run: npm run build
      - run: npm test

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The suite drives the real bundle against a temporary database seeded
      # from the fixture; no worker, so no network calls.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    # Gated on the gates above: a red image build is a symptom, not the bug.
    needs: [lint, build, unit, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker build -f apps/api/Dockerfile -t portfolio-dashboard:ci .
      # The container has to serve the SPA, answer the API, and stop cleanly.
      # The stop half matters because `docker stop` is what a deploy issues, and
      # the shutdown path checkpoints the SQLite WAL: without it a bare copy of
      # portfolio.db can lag its own -wal file by weeks. Verified locally against
      # this image — WAL non-empty while running, truncated to 0 after `docker stop`.
      - name: Smoke the built image
        run: |
          docker run -d --name pd -p 3300:3000 portfolio-dashboard:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3300/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3300/api/health
          curl -fsS -o /dev/null -w 'dashboard %{http_code}\n' http://127.0.0.1:3300/
          curl -fsS -o /dev/null -w 'valuation %{http_code}\n' http://127.0.0.1:3300/api/portfolio/valuation

          # `docker stop` sends SIGTERM and waits out the grace period. The exit
          # code has to be 0: a non-zero exit is what a crashed container returns
          # too, so without this a broken shutdown would look identical to a
          # clean one.
          stop=$(docker stop -w 20 -t 20 pd && echo stopped)
          echo "$stop"
          code=$(docker inspect -f '{{.State.ExitCode}}' pd)
          echo "exit code: $code"
          test "$code" = "0"

          # And the handler has to have run, not just the process to have ended.
          docker logs pd 2>&1 | grep -E 'SIGTERM received|WAL checkpointed|shutdown complete'
          docker rm -f pd
