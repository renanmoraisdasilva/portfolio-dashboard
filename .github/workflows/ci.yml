name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs so private-repo minutes are not wasted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scan's most important check is whether a path
          # like `*.db` or `.env` was EVER committed, which means walking every
          # commit reachable from every ref. At the default shallow clone the
          # runner has one commit, so that check silently inspected nothing and
          # reported "never committed" for all fourteen patterns. The repository
          # has a remote now, so the full history is available; it was pinned
          # shallow back when there was not one. Local verification: 376 commits
          # across 8 refs, zero forbidden paths, so this cannot turn the job red.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `packages/shared` must be built before anything that needs types, because
      # `apps/api` and `apps/web` resolve `@portfolio-dashboard/shared` through its
      # `dist/` (AGENTS.md records this). This used to matter only to the build
      # jobs, which all run one.
      #
      # It now matters here too: the type-aware ESLint rules added in `34080a8`
      # need a real program, so with no `dist/` on a fresh runner the import
      # `import type { components } from '@portfolio-dashboard/shared'` resolves
      # to a TypeScript *error type* — which behaves like `any` — and every union
      # built from it trips `no-redundant-type-constituents`. That produced nine
      # errors here and **zero** locally, because a developer's working tree already
      # has `dist/` from the previous build. The failure mode is "works on my
      # machine" in its purest form: it is a missing artifact, not a code defect.
      #
      # The `lint` script builds it as well, so this is belt and braces: the step
      # makes the dependency visible in the log, and the script keeps a fresh
      # clone correct even if this workflow is edited.
      - run: npm run build --workspace packages/shared
      # A PR cannot merge with an unused import or a stray semicolon.
      - run: npm run lint
      - run: npm run format:check
      - run: npm run scan:secrets
      # Any severity fails the build. The tree is currently at 0, and the one
      # finding that needed an override to get there (esbuild, via drizzle-kit)
      # is documented in AGENTS.md together with the `npm dedupe` step that
      # actually applies it - a lockfile that silently reintroduces the nested
      # copy would otherwise turn this red for a reason nobody could see.
      - run: npm run audit

  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # After a build, so the seam test can assert against apps/web/dist.
      - run: npm run build
      - run: npm test

  e2e:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The suite drives the real bundle against a temporary database seeded
      # from the fixture; no worker, so no network calls.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    # Gated on the gates above: a red image build is a symptom, not the bug.
    needs: [lint, build, unit, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker build -f apps/api/Dockerfile -t portfolio-dashboard:ci .
      # The container has to serve the SPA, answer the API, and stop cleanly.
      # The stop half matters because `docker stop` is what a deploy issues, and
      # the shutdown path checkpoints the SQLite WAL: without it a bare copy of
      # portfolio.db can lag its own -wal file by weeks. Verified locally against
      # this image — WAL non-empty while running, truncated to 0 after `docker stop`.
      - name: Smoke the built image
        run: |
          docker run -d --name pd -p 3300:3000 portfolio-dashboard:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3300/api/health > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3300/api/health
          curl -fsS -o /dev/null -w 'dashboard %{http_code}\n' http://127.0.0.1:3300/
          curl -fsS -o /dev/null -w 'valuation %{http_code}\n' http://127.0.0.1:3300/api/portfolio/valuation

          # `docker stop` sends SIGTERM and waits out the grace period, so this is
          # exactly what a deploy issues. Only `-t/--timeout` is valid here: `-w`
          # belongs to `docker run`, and passing it fails the step with exit 125
          # before the container is ever signalled.
          docker stop -t 20 pd

          # The exit code has to be 0. A crashed container also ends with a
          # non-zero code, so without this a broken shutdown would look identical
          # to a clean one.
          code=$(docker inspect -f '{{.State.ExitCode}}' pd)
          echo "exit code after stop: $code"
          if [ "$code" != "0" ]; then
            echo "::error::container exited $code on SIGTERM; the shutdown path did not run cleanly"
            docker logs pd
            exit 1
          fi

          # And the handler has to have run, not just the process to have ended.
          # `process.exit(0)` on an unhandled path would satisfy the exit code
          # while skipping the WAL checkpoint.
          docker logs pd 2>&1 | grep -E 'SIGTERM received' || {
            echo "::error::no SIGTERM handler ran"
            exit 1
          }
          docker logs pd 2>&1 | grep -E 'WAL checkpointed and connection closed' || {
            echo "::error::the database was not closed cleanly, so the WAL was not checkpointed"
            exit 1
          }
          docker rm -f pd
