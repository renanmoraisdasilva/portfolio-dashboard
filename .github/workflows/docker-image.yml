name: Build and push Docker image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          # No build-args. `HOME_ASSISTANT_WEBHOOK_URL` used to be passed here,
          # which persisted the real webhook into the published image config:
          # `docker history` and `docker inspect` both print it, and the image is
          # pushed on every commit. The app reads the variable from its runtime
          # environment, so the deployment supplies it instead - nothing is lost
          # and nothing is published. See apps/api/Dockerfile.
          tags: |
            ghcr.io/${{ github.repository_owner }}/portfolio-dashboard:${{ github.sha }}
