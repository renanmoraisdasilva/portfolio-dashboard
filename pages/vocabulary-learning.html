<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Learning Platform</title>
    <link rel="stylesheet" href="/static/css/vocabulary.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Vocabulary Learning Platform</h1>
            <p>Upload subtitle files and master new vocabulary</p>
        </div>

        <!-- Context Modal -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <div class="modal-header">
                    <h2 id="modalTitle">Word in Context</h2>
                    <div style="margin-left:12px;display:inline-flex;gap:8px;align-items:center">
                        <button id="translateBtn" class="btn btn-secondary" title="Translate & define">🔤 Translate</button>
                    </div>
                    <button class="modal-close" id="modalClose">✕</button>
                </div>
                <div class="modal-body">
                    <div class="context-list" id="contextList"></div>
                </div>
            </div>
        </div>

        <!-- Title picker modal (shown when a user uploads a captions file) -->
        <div class="modal-overlay" id="titleModalOverlay" style="display:none;">
            <div class="modal">
                <div class="modal-header">
                    <h2 id="titleModalHeading">New Class Title</h2>
                </div>
                <div class="modal-body">
                    <div style="display:flex;flex-direction:column;gap:12px;">
                        <input id="titleInput" type="text" placeholder="Class title" style="padding:10px;border-radius:8px;border:1px solid #2d3548;background:#0f1419;color:#e4e6eb;" />
                        <div style="display:flex;gap:8px;justify-content:flex-end;">
                            <button id="titleCancelBtn" class="btn btn-secondary">Cancel</button>
                            <button id="titleSaveBtn" class="btn btn-primary">Save</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Translation / Dictionary modal (shows translation + definitions/examples) -->
        <div class="modal-overlay" id="translateOverlay" style="display:none;">
            <div class="modal">
                <div class="modal-header">
                    <h2 id="translateModalTitle">Translation & Definitions</h2>
                    <button class="modal-close" id="translateClose">✕</button>
                </div>
                <div class="modal-body" id="translateBody" style="min-height:120px;">
                    <div id="translateLoading">Ready to translate.</div>
                    <div id="translateContent" style="display:none; margin-top:8px;"></div>
                </div>
            </div>
        </div>

        <div class="upload-section" id="uploadSection">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <h2>Upload SRT or TXT File</h2>
                <!-- accept both extensions for convenience -->
                <input type="file" id="fileInput" accept=".srt,.txt">
            </div>
        </div>

        <div class="stats-bar" id="statsBar">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="totalWords">0</div>
                    <div class="stat-label">Total Unique Words</div>
                </div>
                <div class="stat-card known">
                    <div class="stat-number" id="knownWords">0</div>
                    <div class="stat-label">Known Words</div>
                </div>
                <div class="stat-card unknown">
                    <div class="stat-number" id="unknownWords">0</div>
                    <div class="stat-label">Unknown Words</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="percentageKnown">0%</div>
                    <div class="stat-label">Completion</div>
                </div>
            </div>
        </div>

        <div class="class-section" id="classSection">
            <h3>📚 My Classes</h3>
            <div class="class-grid" id="classGrid"></div>
        </div>

        <div class="filters" id="filters">
            <div class="filter-buttons">
                <button class="filter-btn" data-filter="all">All Words</button>
                <button class="filter-btn" data-filter="known">Known</button>
                <button class="filter-btn" data-filter="unknown">Unknown</button>
                <button class="filter-btn" data-filter="excluded">Excluded</button>
                <button class="filter-btn active" data-filter="unreviewed">Not Reviewed</button>
                <input type="text" class="search-box" id="searchBox" placeholder="Search words...">
            </div>
            <div class="action-buttons">
                <button class="btn btn-secondary" id="resetBtn">Reset All</button>
                <button class="btn btn-primary" id="exportBtn">Export Progress</button>
                <button class="btn btn-secondary" id="importJsonBtn">Import JSON</button>
                <button class="btn btn-secondary" id="exportUnknownBtn">Export Unknown Words</button>
                <input type="file" id="importJsonFile" accept="application/json" style="display:none" />
            </div>
        </div>

        <div class="words-section" id="wordsSection">
            <div class="words-grid" id="wordsGrid"></div>
        </div>
    </div>

    <script src="/static/js/vocabulary.js"></script>
</body>
</html>
