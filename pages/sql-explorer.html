<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SQL Explorer — Portfolio Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/icon.png" sizes="16x16">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">

  <!-- CodeMirror 6 via CDN (codemirror.net, MIT license, actively maintained) -->
  <script type="module">
    import { EditorView, keymap, highlightActiveLine, lineNumbers, highlightActiveLineGutter, drawSelection } from 'https://esm.sh/@codemirror/view@6';
    import { EditorState, Compartment } from 'https://esm.sh/@codemirror/state@6';
    import { defaultKeymap, historyKeymap, history, indentWithTab } from 'https://esm.sh/@codemirror/commands@6';
    import { sql, SQLite } from 'https://esm.sh/@codemirror/lang-sql@6';
    import { oneDark } from 'https://esm.sh/@codemirror/theme-one-dark@6';
    import { syntaxHighlighting, defaultHighlightStyle, bracketMatching } from 'https://esm.sh/@codemirror/language@6';
    import { autocompletion, completionKeymap } from 'https://esm.sh/@codemirror/autocomplete@6';
    import { lintKeymap } from 'https://esm.sh/@codemirror/lint@6';

    let editor;

    function initEditor() {
      const startDoc = `-- SQL Explorer\n-- Select a database above, then write your query.\n\nSELECT * FROM trades ORDER BY time DESC LIMIT 20;`;

      editor = new EditorView({
        state: EditorState.create({
          doc: startDoc,
          extensions: [
            lineNumbers(),
            highlightActiveLineGutter(),
            history(),
            drawSelection(),
            bracketMatching(),
            highlightActiveLine(),
            autocompletion(),
            sql({ dialect: SQLite }),
            oneDark,
            keymap.of([
              ...defaultKeymap,
              ...historyKeymap,
              ...completionKeymap,
              ...lintKeymap,
              indentWithTab,
              { key: 'Ctrl-Enter', run: () => { window.runQuery(); return true; } },
              { key: 'Mod-Enter', run: () => { window.runQuery(); return true; } },
            ]),
            EditorView.theme({
              '&': {
                fontSize: '0.9rem',
                fontFamily: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace",
                borderRadius: '8px',
                overflow: 'hidden',
              },
              '.cm-scroller': { minHeight: '180px' },
              '.cm-content': { padding: '12px 0' },
            }),
          ],
        }),
        parent: document.getElementById('editor-mount'),
      });

      window._cmEditor = editor;
    }

    window.getEditorValue = () => editor?.state.doc.toString() ?? '';

    document.addEventListener('DOMContentLoaded', initEditor);
  </script>

  <style>
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      padding: 0;
    }

    /* ── Layout ── */
    .page-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    /* ── Header ── */
    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .page-header a.back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: color 0.15s, border-color 0.15s;
    }
    .page-header a.back-btn:hover { color: var(--text-primary); border-color: var(--accent-primary); }
    .page-header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .page-header h1 .icon { font-size: 1.4rem; }

    /* ── Card ── */
    .card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .db-select-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .db-select-wrap label {
      font-size: 0.82rem;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    select.db-picker {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 0.88rem;
      cursor: pointer;
      outline: none;
      min-width: 140px;
    }
    select.db-picker:focus { border-color: var(--accent-primary); }

    .run-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--accent-primary);
      color: #0a0e1a;
      border: none;
      border-radius: 7px;
      padding: 8px 18px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    .run-btn:hover { opacity: 0.85; }
    .run-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .run-btn .kbd {
      font-size: 0.72rem;
      background: rgba(0,0,0,0.25);
      border-radius: 4px;
      padding: 2px 5px;
      letter-spacing: 0;
      font-weight: 600;
    }

    .clear-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 7px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .clear-btn:hover { color: var(--text-primary); border-color: var(--text-secondary); }

    /* ── Editor ── */
    #editor-mount {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #282c34;
    }
    #editor-mount .cm-editor { outline: none !important; }

    /* ── Schema sidebar + main ── */
    .explorer-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 700px) {
      .explorer-layout { grid-template-columns: 1fr; }
    }

    /* ── Schema panel ── */
    .schema-panel {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      min-width: 0;
    }
    .schema-panel h2 {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .schema-loading { color: var(--text-muted); font-size: 0.82rem; }

    .table-list { list-style: none; }
    .table-list li {
      margin-bottom: 4px;
    }
    .table-list .tbl-btn {
      background: none;
      border: none;
      color: var(--accent-primary);
      font-size: 0.83rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 5px;
      text-align: left;
      width: 100%;
      transition: background 0.12s;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      word-break: break-all;
    }
    .table-list .tbl-btn:hover { background: rgba(0,217,255,0.08); }

    .col-list {
      list-style: none;
      padding: 4px 0 8px 12px;
      border-left: 2px solid var(--border);
      margin-left: 10px;
      margin-top: 4px;
    }
    .col-list li {
      font-size: 0.75rem;
      color: var(--text-secondary);
      padding: 2px 0;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      display: flex;
      gap: 6px;
    }
    .col-list li .col-name { color: var(--text-primary); }
    .col-list li .col-type { color: var(--text-muted); font-size: 0.7rem; }

    /* ── Results ── */
    #results-area {
      margin-top: 0;
    }

    .results-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .results-meta .badge {
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .badge-success { background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
    .badge-error   { background: rgba(239,68,68,0.15);  color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
    .badge-info    { background: rgba(0,217,255,0.1);   color: var(--accent-primary); border: 1px solid rgba(0,217,255,0.25); }

    .export-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .export-btn:hover { color: var(--text-primary); border-color: var(--text-secondary); }

    .results-table-wrap {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .results-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .results-table th {
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      padding: 10px 12px;
      text-align: left;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
    }
    .results-table td {
      padding: 9px 12px;
      border-bottom: 1px solid rgba(45,55,72,0.6);
      color: var(--text-primary);
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.8rem;
    }
    .results-table td.null-val { color: var(--text-muted); font-style: italic; }
    .results-table tr:last-child td { border-bottom: none; }
    .results-table tr:hover td { background: rgba(255,255,255,0.03); }

    .result-empty {
      text-align: center;
      padding: 32px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .write-result {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px;
      background: rgba(16,185,129,0.07);
      border: 1px solid rgba(16,185,129,0.2);
      border-radius: 8px;
      color: #10b981;
      font-size: 0.9rem;
    }

    .error-box {
      padding: 14px 16px;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 8px;
      color: #ef4444;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .placeholder-msg {
      text-align: center;
      padding: 40px 0;
      color: var(--text-muted);
    }
    .placeholder-msg .icon { font-size: 2.5rem; margin-bottom: 10px; }
    .placeholder-msg p { font-size: 0.88rem; }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0,217,255,0.3);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Query history ── */
    .history-list {
      list-style: none;
      max-height: 200px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .history-list li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(45,55,72,0.5);
    }
    .history-list li:last-child { border-bottom: none; }
    .history-list .hist-sql {
      flex: 1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .history-list .hist-sql:hover { color: var(--accent-primary); }
    .history-list .hist-time { font-size: 0.7rem; color: var(--text-muted); white-space: nowrap; }
    .history-list .hist-db {
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 600;
    }
    .hist-db-portfolio { background: rgba(0,217,255,0.1); color: var(--accent-primary); }
    .hist-db-finance    { background: rgba(124,58,237,0.15); color: #a78bfa; }
    .hist-db-vocabulary { background: rgba(16,185,129,0.1); color: #10b981; }

    .no-history { color: var(--text-muted); font-size: 0.82rem; text-align: center; padding: 16px 0; }
  </style>
</head>
<body>
<div class="page-wrap">

  <!-- Header -->
  <div class="page-header">
    <a href="/" class="back-btn">← Dashboard</a>
    <h1><span class="icon">🗄️</span> SQL Explorer</h1>
  </div>

  <div class="explorer-layout">

    <!-- Schema sidebar -->
    <div class="schema-panel">
      <h2>Schema</h2>
      <div id="schema-content" class="schema-loading">Loading…</div>
    </div>

    <!-- Main area -->
    <div>

      <!-- Query editor card -->
      <div class="card">
        <div class="toolbar">
          <div class="db-select-wrap">
            <label for="db-picker">Database</label>
            <select id="db-picker" class="db-picker" onchange="onDbChange()">
              <option value="portfolio">portfolio.db</option>
              <option value="finance">finance.db</option>
              <option value="vocabulary">vocabulary.db</option>
            </select>
          </div>
          <button class="run-btn" id="run-btn" onclick="runQuery()">
            ▶ Run <span class="kbd">Ctrl+↵</span>
          </button>
          <button class="clear-btn" onclick="clearEditor()">Clear</button>
        </div>
        <div id="editor-mount"></div>
      </div>

      <!-- Results card -->
      <div class="card" id="results-card">
        <div id="results-area">
          <div class="placeholder-msg">
            <div class="icon">⚡</div>
            <p>Run a query to see results</p>
          </div>
        </div>
      </div>

      <!-- Query history card -->
      <div class="card">
        <div class="card-title">Query History</div>
        <ul class="history-list" id="history-list">
          <li><div class="no-history">No queries yet.</div></li>
        </ul>
      </div>

    </div>
  </div>

</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const queryHistory = [];
let schemaCache = {};

// ── Schema loader ─────────────────────────────────────────────────────────
async function loadSchema(dbName) {
  const el = document.getElementById('schema-content');
  el.innerHTML = '<span class="schema-loading">Loading…</span>';

  if (schemaCache[dbName]) {
    renderSchema(schemaCache[dbName], dbName);
    return;
  }

  try {
    const res = await fetch(`/api/sql/tables?db=${encodeURIComponent(dbName)}`);
    const data = await res.json();
    if (!res.ok) { el.innerHTML = `<span style="color:var(--accent-danger);font-size:0.8rem;">${data.error}</span>`; return; }
    schemaCache[dbName] = data.tables;
    renderSchema(data.tables, dbName);
  } catch (e) {
    el.innerHTML = `<span style="color:var(--accent-danger);font-size:0.8rem;">Failed to load schema</span>`;
  }
}

function renderSchema(tables, dbName) {
  const el = document.getElementById('schema-content');
  if (!tables.length) { el.innerHTML = '<span class="schema-loading">No tables found</span>'; return; }

  const ul = document.createElement('ul');
  ul.className = 'table-list';

  tables.forEach(tbl => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'tbl-btn';
    btn.textContent = tbl;
    btn.title = `Click to expand columns`;

    let expanded = false;
    let colsLoaded = false;
    let colUl = null;

    btn.onclick = async () => {
      if (!expanded) {
        if (!colsLoaded) {
          const loadingLi = document.createElement('li');
          loadingLi.style.color = 'var(--text-muted)';
          loadingLi.style.fontSize = '0.75rem';
          loadingLi.style.paddingLeft = '12px';
          loadingLi.textContent = 'Loading…';
          colUl = document.createElement('ul');
          colUl.className = 'col-list';
          colUl.appendChild(loadingLi);
          li.appendChild(colUl);

          try {
            const r = await fetch(`/api/sql/schema?db=${encodeURIComponent(dbName)}&table=${encodeURIComponent(tbl)}`);
            const d = await r.json();
            colUl.innerHTML = '';
            (d.columns || []).forEach(col => {
              const cli = document.createElement('li');
              cli.innerHTML = `<span class="col-name">${escHtml(col.name)}</span><span class="col-type">${escHtml(col.type || '')}</span>`;
              colUl.appendChild(cli);
            });
            colsLoaded = true;
          } catch {
            colUl.innerHTML = '<li style="color:var(--accent-danger);font-size:0.75rem;">Error</li>';
          }
        } else {
          li.appendChild(colUl);
        }
        expanded = true;
        btn.title = 'Click to collapse';
      } else {
        if (colUl) li.removeChild(colUl);
        expanded = false;
        btn.title = 'Click to expand columns';
      }
    };

    li.appendChild(btn);
    ul.appendChild(li);
  });

  el.innerHTML = '';
  el.appendChild(ul);
}

// ── Run query ─────────────────────────────────────────────────────────────
async function runQuery() {
  const sql = (window.getEditorValue ? window.getEditorValue() : '').trim();
  if (!sql) return;

  const dbName = document.getElementById('db-picker').value;
  const btn = document.getElementById('run-btn');
  const area = document.getElementById('results-area');

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Running…';
  area.innerHTML = '<div style="text-align:center;padding:32px 0;color:var(--text-muted);"><span class="spinner"></span></div>';

  const startMs = Date.now();
  try {
    const res = await fetch('/api/sql/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sql, db: dbName }),
    });
    const data = await res.json();
    const elapsed = Date.now() - startMs;

    addToHistory(sql, dbName, res.ok);

    if (!res.ok) {
      area.innerHTML = `
        <div class="results-meta">
          <span class="badge badge-error">Error</span>
        </div>
        <div class="error-box">${escHtml(data.error || 'Unknown error')}</div>`;
    } else if (data.type === 'write') {
      area.innerHTML = `
        <div class="results-meta">
          <span class="badge badge-success">✓ Success</span>
          <span style="font-size:0.78rem;color:var(--text-muted);">${elapsed}ms</span>
        </div>
        <div class="write-result">✓ ${escHtml(data.message)}</div>`;
    } else {
      renderTable(data.rows || [], data.columns || [], elapsed);
    }
  } catch (e) {
    area.innerHTML = `<div class="error-box">Network error: ${escHtml(e.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '▶ Run <span class="kbd">Ctrl+↵</span>';
  }
}

function renderTable(rows, columns, elapsed) {
  const area = document.getElementById('results-area');

  const metaHtml = `
    <div class="results-meta">
      <span class="badge badge-info">${rows.length} row${rows.length !== 1 ? 's' : ''}</span>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:0.78rem;color:var(--text-muted);">${elapsed}ms</span>
        ${rows.length ? `<button class="export-btn" onclick="exportCSV()">⬇ CSV</button>` : ''}
      </div>
    </div>`;

  if (!columns.length && !rows.length) {
    area.innerHTML = metaHtml + '<div class="result-empty">Query returned no results.</div>';
    return;
  }

  const headerCells = columns.map(c => `<th>${escHtml(c)}</th>`).join('');
  const bodyRows = rows.map(row =>
    `<tr>${columns.map(c => {
      const v = row[c];
      if (v === null || v === undefined) return `<td class="null-val">NULL</td>`;
      return `<td title="${escAttr(String(v))}">${escHtml(String(v))}</td>`;
    }).join('')}</tr>`
  ).join('');

  area.innerHTML = `${metaHtml}
    <div class="results-table-wrap">
      <table class="results-table">
        <thead><tr>${headerCells}</tr></thead>
        <tbody>${bodyRows || '<tr><td colspan="' + columns.length + '" class="result-empty">No rows returned.</td></tr>'}</tbody>
      </table>
    </div>`;

  // stash for CSV export
  window._lastResult = { rows, columns };
}

// ── CSV export ─────────────────────────────────────────────────────────────
function exportCSV() {
  const { rows, columns } = window._lastResult || {};
  if (!rows || !columns) return;
  const esc = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const csv = [columns.map(esc).join(','), ...rows.map(r => columns.map(c => esc(r[c])).join(','))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `query-result-${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── History ────────────────────────────────────────────────────────────────
function addToHistory(sql, dbName, ok) {
  const entry = { sql: sql.length > 120 ? sql.slice(0, 120) + '…' : sql, dbName, time: new Date(), ok };
  queryHistory.unshift(entry);
  if (queryHistory.length > 30) queryHistory.pop();
  renderHistory();
}

function renderHistory() {
  const ul = document.getElementById('history-list');
  if (!queryHistory.length) {
    ul.innerHTML = '<li><div class="no-history">No queries yet.</div></li>';
    return;
  }
  ul.innerHTML = queryHistory.map((e, i) => `
    <li>
      <span class="hist-sql" onclick="loadHistoryEntry(${i})" title="${escAttr(e.sql)}">${escHtml(e.sql)}</span>
      <span class="hist-db hist-db-${e.dbName}">${e.dbName}</span>
      <span class="hist-time">${e.time.toLocaleTimeString()}</span>
    </li>`).join('');
}

function loadHistoryEntry(i) {
  const entry = queryHistory[i];
  if (!entry) return;
  document.getElementById('db-picker').value = entry.dbName;
  onDbChange(false);
  if (window._cmEditor) {
    window._cmEditor.dispatch({
      changes: { from: 0, to: window._cmEditor.state.doc.length, insert: entry.sql }
    });
  }
}

// ── Misc ───────────────────────────────────────────────────────────────────
function onDbChange(reloadSchema = true) {
  const dbName = document.getElementById('db-picker').value;
  if (reloadSchema) loadSchema(dbName);
  // Reset schema cache for fresh data
  schemaCache = {};
  loadSchema(dbName);
}

function clearEditor() {
  if (window._cmEditor) {
    window._cmEditor.dispatch({
      changes: { from: 0, to: window._cmEditor.state.doc.length, insert: '' }
    });
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}

// ── Init ───────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  loadSchema('portfolio');
});
</script>
</body>
</html>
