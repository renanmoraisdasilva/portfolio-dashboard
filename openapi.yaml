openapi: 3.0.3
info:
  title: Portfolio Dashboard API
  version: '0.1.0'
  description: Minimal API for the portfolio dashboard (LAN deployment)
servers:
  - url: http://localhost:3000/api
tags:
  - name: State
    description: App state endpoints
  - name: Health
    description: Health and diagnostics endpoints
  - name: Trades
    description: Trade management endpoints
  - name: History
    description: History point endpoints
  - name: Cash
    description: Cash position endpoints
  - name: Interest
    description: Interest month endpoints
  - name: Prices
    description: Price data endpoints
  - name: Asset
    description: Asset history endpoints
  - name: Alerts
    description: Alert endpoints
  - name: Config
    description: Configuration endpoints
  - name: Scenarios
    description: Scenario persistence endpoints
  - name: Vocabulary
    description: Vocabulary learning endpoints
  - name: Finance
    description: Finance export/import and general finance operations
  - name: Finance - Income
    description: Income management within finance
  - name: Finance - Fixed
    description: Fixed expense management within finance
  - name: Finance - Eventual
    description: Eventual expense management within finance
  - name: Finance - Credit
    description: Credit card expense management within finance
  - name: Finance - Years
    description: Finance year management endpoints
paths:
  /state:
    get:
      tags: [State]
      summary: Get full app state
      responses:
        '200':
          description: App state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateResponse'
    delete:
      tags: [State]
      summary: Erase all app state data
      responses:
        '204':
          description: State erased
  /state/export:
    get:
      tags: [State]
      summary: Export full app state as JSON
      responses:
        '200':
          description: Exported app state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateResponse'
  /state/import:
    post:
      tags: [State]
      summary: Import app state JSON payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateImportPayload'
      responses:
        '200':
          description: Imported app state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /cash:
    get:
      tags: [Cash]
      summary: Get cash positions
      responses:
        '200':
          description: Cash positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashPositions'
    put:
      tags: [Cash]
      summary: Update cash positions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashPositions'
      responses:
        '200':
          description: Updated cash positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashPositions'
  /interest/months:
    get:
      tags: [Interest]
      summary: List interest months
      responses:
        '200':
          description: Interest months
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InterestMonth'
    post:
      tags: [Interest]
      summary: Add or replace interest month
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestMonth'
      responses:
        '201':
          description: Added interest month
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestMonth'
  /interest/months/{month}:
    delete:
      tags: [Interest]
      summary: Delete an interest month
      parameters:
        - name: month
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /prices:
    get:
      tags: [Prices]
      summary: Get cached prices
      responses:
        '200':
          description: Current cached prices
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: number
  /asset/{symbol}/history:
    get:
      tags: [Asset]
      summary: Get historical price data for an asset symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 60
      responses:
        '200':
          description: Asset history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetHistory'
  /history:
    get:
      tags: [History]
      summary: Get history points, optional range filter
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month, 6months, year, all]
            default: all
      responses:
        '200':
          description: History points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryPoint'
    delete:
      tags: [History]
      summary: Clear all history points
      responses:
        '204':
          description: All history points cleared
  /history/point:
    post:
      tags: [History]
      summary: Add a history point
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoryPoint'
      responses:
        '201':
          description: History point created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPoint'
  /history/{id}:
    delete:
      tags: [History]
      summary: Delete a history point by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /alerts:
    get:
      tags: [Alerts]
      summary: Get all alerts
      responses:
        '200':
          description: Alerts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'
    post:
      tags: [Alerts]
      summary: Create a new alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertCreate'
      responses:
        '201':
          description: Alert created
          content:
            application/json:
              schema:
                type: object
                properties:
                  alert:
                    $ref: '#/components/schemas/Alert'
  /alerts/triggered:
    get:
      tags: [Alerts]
      summary: Get triggered alerts
      responses:
        '200':
          description: Triggered alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TriggeredAlert'
  /alerts/{id}:
    put:
      tags: [Alerts]
      summary: Update an alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertUpdate'
      responses:
        '200':
          description: Alert updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  alert:
                    $ref: '#/components/schemas/Alert'
    delete:
      tags: [Alerts]
      summary: Delete an alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /alerts/dismiss/{triggeredAlertId}:
    post:
      tags: [Alerts]
      summary: Dismiss a triggered alert
      parameters:
        - name: triggeredAlertId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dismissed alert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggeredAlert'
  /alerts/test-notify:
    post:
      tags: [Alerts]
      summary: Send a test notification
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                message:
                  type: string
      responses:
        '200':
          description: Test notification sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
  /config/symbols:
    get:
      tags: [Config]
      summary: Get available symbol configuration
      responses:
        '200':
          description: Symbols list
          content:
            application/json:
              schema:
                type: object
                properties:
                  all:
                    type: array
                    items:
                      type: string
                  crypto:
                    type: array
                    items:
                      type: string
                  stocks:
                    type: array
                    items:
                      type: string
                  currencies:
                    type: array
                    items:
                      type: string
                  detailed:
                    type: object
                    additionalProperties:
                      type: object
  /config/symbols/{symbol}:
    get:
      tags: [Config]
      summary: Get configuration for a specific symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Symbol config
          content:
            application/json:
              schema:
                type: object
  /scenarios:
    get:
      tags: [Scenarios]
      summary: List saved scenarios
      responses:
        '200':
          description: Scenario list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScenarioSummary'
    post:
      tags: [Scenarios]
      summary: Create a new scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioCreate'
      responses:
        '201':
          description: Scenario created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioSummary'
  /scenarios/{id}:
    get:
      tags: [Scenarios]
      summary: Get scenario details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scenario detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioDetail'
    put:
      tags: [Scenarios]
      summary: Update an existing scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioCreate'
      responses:
        '200':
          description: Scenario updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioSummary'
    delete:
      tags: [Scenarios]
      summary: Delete a scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scenario deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /vocab:
    get:
      tags: [Vocabulary]
      summary: List vocabulary entries
      responses:
        '200':
          description: Vocabulary entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VocabularyEntry'
  /vocab/import:
    post:
      tags: [Vocabulary]
      summary: Import vocabulary entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/VocabularyImportEntry'
      responses:
        '201':
          description: Vocabulary imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  inserted:
                    type: integer
  /vocab/class:
    post:
      tags: [Vocabulary]
      summary: Create a vocabulary class with entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VocabularyClassCreate'
      responses:
        '201':
          description: Vocabulary class created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VocabularyClass'
  /vocab/classes:
    get:
      tags: [Vocabulary]
      summary: List vocabulary classes
      responses:
        '200':
          description: Vocabulary classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VocabularyClass'
  /vocab/class/{id}:
    delete:
      tags: [Vocabulary]
      summary: Delete a vocabulary class
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /vocab/status:
    post:
      tags: [Vocabulary]
      summary: Update vocabulary status flags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/VocabularyStatusUpdate'
                - type: array
                  items:
                    $ref: '#/components/schemas/VocabularyStatusUpdate'
      responses:
        '200':
          description: Updated vocabulary statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VocabularyEntry'
  /vocab/exclude:
    post:
      tags: [Vocabulary]
      summary: Set excluded flag on vocabulary entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/VocabularyExcludeRequest'
                - type: array
                  items:
                    $ref: '#/components/schemas/VocabularyExcludeRequest'
      responses:
        '200':
          description: Updated excluded flags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VocabularyEntry'
  /vocab/reset:
    post:
      tags: [Vocabulary]
      summary: Reset all vocabulary statuses
      responses:
        '204':
          description: Reset
  /vocab/{id}:
    delete:
      tags: [Vocabulary]
      summary: Delete a vocabulary entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /health:
    get:
      tags: [Health]
      summary: Server health
      responses:
        '200':
          description: Health info
  /trades:
    post:
      tags: [Trades]
      summary: Add a trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Trade'
      responses:
        '201':
          description: Trade created
  /trades/{id}:
    delete:
      tags: [Trades]
      summary: Delete trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /finance:
    get:
      tags: [Finance]
      summary: Export finance JSON state
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Finance JSON export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceJSON'
  /finance/import:
    post:
      tags: [Finance]
      summary: Import finance JSON state
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceJSON'
      responses:
        '201':
          description: Imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
    
  /finance/init:
    post:
      tags: [Finance]
      summary: Initialize or migrate finance DB schema
      responses:
        '200':
          description: Initialized
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /finance/incomes:
    post:
      tags: [Finance - Income]
      summary: Add income
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomeCreate'
      responses:
        '201':
          description: Income added
          content:
            application/json:
              schema:
                type: object
                properties:
                  income:
                    $ref: '#/components/schemas/Income'
  /finance/incomes/{id}:
    put:
      tags: [Finance - Income]
      summary: Update income
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncomeUpdate'
      responses:
        '200':
          description: Income updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  income:
                    $ref: '#/components/schemas/Income'
    delete:
      tags: [Finance - Income]
      summary: Delete income
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /finance/fixed:
    get:
      tags: [Finance - Fixed]
      summary: List fixed expenses
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: integer
        - name: year
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Fixed expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FixedExpense'
    post:
      tags: [Finance - Fixed]
      summary: Add fixed expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixedExpenseCreate'
      responses:
        '201':
          description: Fixed expense added
          content:
            application/json:
              schema:
                type: object
                properties:
                  fixed:
                    $ref: '#/components/schemas/FixedExpense'
  /finance/fixed/{id}:
    put:
      tags: [Finance - Fixed]
      summary: Update fixed expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FixedExpenseUpdate'
      responses:
        '200':
          description: Fixed expense updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  fixed:
                    $ref: '#/components/schemas/FixedExpense'
    delete:
      tags: [Finance - Fixed]
      summary: Delete fixed expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /finance/eventual:
    get:
      tags: [Finance - Eventual]
      summary: List eventual expenses
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: integer
        - name: year
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Eventual expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventualExpense'
    post:
      tags: [Finance - Eventual]
      summary: Add eventual expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventualExpenseCreate'
      responses:
        '201':
          description: Eventual expense added
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventual:
                    $ref: '#/components/schemas/EventualExpense'
  /finance/eventual/{id}:
    put:
      tags: [Finance - Eventual]
      summary: Update eventual expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventualExpenseUpdate'
      responses:
        '200':
          description: Eventual expense updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventual:
                    $ref: '#/components/schemas/EventualExpense'
    delete:
      tags: [Finance - Eventual]
      summary: Delete eventual expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /finance/credit:
    get:
      tags: [Finance - Credit]
      summary: List credit card expenses
      parameters:
        - name: card
          in: query
          required: true
          schema:
            type: string
            enum: [nuRenan, nuJu, nomad]
        - name: month
          in: query
          required: true
          schema:
            type: integer
        - name: year
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Credit expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreditExpense'
    post:
      tags: [Finance - Credit]
      summary: Add credit expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditExpenseCreate'
      responses:
        '201':
          description: Credit expense added
          content:
            application/json:
              schema:
                type: object
                properties:
                  credit:
                    $ref: '#/components/schemas/CreditExpense'
  /finance/credit/{id}:
    put:
      tags: [Finance - Credit]
      summary: Update credit expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditExpenseUpdate'
      responses:
        '200':
          description: Credit expense updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  credit:
                    $ref: '#/components/schemas/CreditExpense'
    delete:
      tags: [Finance - Credit]
      summary: Delete credit expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /finance/years:
    get:
      tags: [Finance - Years]
      summary: List available finance years
      responses:
        '200':
          description: Years list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
    post:
      tags: [Finance - Years]
      summary: Create a finance year
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YearPayload'
      responses:
        '201':
          description: Year created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  year:
                    type: integer
  /finance/years/{year}/reset:
    post:
      tags: [Finance - Years]
      summary: Reset finance data for a year
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Year reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  year:
                    type: integer
components:
  schemas:
    Trade:
      type: object
      properties:
        id:
          type: string
        symbol:
          type: string
        side:
          type: string
          enum: [buy, sell]
        qty:
          type: number
        price:
          type: number
        time:
          type: string
          format: date-time
    HistoryPoint:
      type: object
      properties:
        id:
          type: string
        t:
          type: string
        ts:
          type: integer
        v:
          type: number
        i:
          type: number
        p:
          type: number
        manual:
          type: boolean
        note:
          type: string
    CashPositions:
      type: object
      properties:
        cashReais:
          type: number
        cashDollars:
          type: number
        interestReais:
          type: number
        interestDollars:
          type: number
    InterestMonth:
      type: object
      properties:
        month:
          type: string
        amount:
