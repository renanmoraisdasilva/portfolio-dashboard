openapi: 3.0.3
info:
  title: Portfolio Dashboard API
  version: '0.1.0'
  description: Minimal API for the portfolio dashboard (LAN deployment)
servers:
  - url: http://localhost:3000/api
tags:
  - name: State
    description: App state endpoints
  - name: Health
    description: Health and diagnostics endpoints
  - name: Trades
    description: Trade management endpoints
  - name: History
    description: History point endpoints
  - name: Cash
    description: Cash position endpoints
  - name: Interest
    description: Interest month endpoints
  - name: Prices
    description: Price data endpoints
  - name: Asset
    description: Asset history endpoints
  - name: Alerts
    description: Alert endpoints
  - name: Config
    description: Configuration endpoints
  - name: Scenarios
    description: Scenario persistence endpoints
  - name: Analytics
    description: Analytics snapshot endpoints
  - name: Migrations
    description: Maintenance backfill migrations
  - name: SQL Explorer
    description: Read-only SQL console endpoints
paths:
  /state:
    get:
      tags: [State]
      summary: Get full app state
      responses:
        '200':
          description: App state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateResponse'
    delete:
      tags: [State]
      summary: Erase all app state data
      responses:
        '204':
          description: State erased
  /state/export:
    get:
      tags: [State]
      summary: Export full app state as JSON
      responses:
        '200':
          description: Exported app state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateResponse'
  /state/import:
    post:
      tags: [State]
      summary: Import app state JSON payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateImportPayload'
      responses:
        '200':
          description: Imported app state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /cash:
    get:
      tags: [Cash]
      summary: Get cash positions
      responses:
        '200':
          description: Cash positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashPositions'
    put:
      tags: [Cash]
      summary: Update cash positions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashPositions'
      responses:
        '200':
          description: Updated cash positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashPositions'
  /cash/entries:
    get:
      tags: [Cash]
      summary: List cash ledger entries
      responses:
        '200':
          description: Cash entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CashEntry'
    post:
      tags: [Cash]
      summary: Append a cash ledger entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashEntryCreate'
      responses:
        '201':
          description: Entry created, with recomputed totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry:
                    $ref: '#/components/schemas/CashEntry'
                  totals:
                    $ref: '#/components/schemas/CashTotals'
        '400':
          description: currency must be BRL or USD, amount must be a non-zero number
  /cash/entries/{id}:
    delete:
      tags: [Cash]
      summary: Delete a cash ledger entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entry deleted, with recomputed totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  totals:
                    $ref: '#/components/schemas/CashTotals'
  /interest/months:
    get:
      tags: [Interest]
      summary: List interest months
      responses:
        '200':
          description: Interest months
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InterestMonth'
    post:
      tags: [Interest]
      summary: Add or replace interest month
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestMonth'
      responses:
        '201':
          description: Added interest month
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestMonth'
  /interest/months/{month}:
    delete:
      tags: [Interest]
      summary: Delete an interest month
      parameters:
        - name: month
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /prices:
    get:
      tags: [Prices]
      summary: Get cached prices
      responses:
        '200':
          description: Current cached prices
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: number
  /asset/{symbol}/history:
    get:
      tags: [Asset]
      summary: Get historical price data for an asset symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 60
      responses:
        '200':
          description: Asset history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetHistory'
  /asset/{symbol}/ohlc:
    get:
      tags: [Asset]
      summary: Get OHLC candles for an asset symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          required: false
          description: Lookback window in days; values above 1825 are capped
          schema:
            type: integer
            default: 60
      responses:
        '200':
          description: Candles bucketed to 4h, 1d or 7d depending on the window
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OhlcCandle'
        '400':
          description: Invalid days parameter
  /history:
    get:
      tags: [History]
      summary: Get history points, optional range filter
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month, 6months, year, all]
            default: all
      responses:
        '200':
          description: History points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryPoint'
    delete:
      tags: [History]
      summary: Clear all history points
      responses:
        '204':
          description: All history points cleared
  /history/point:
    post:
      tags: [History]
      summary: Add a history point
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoryPoint'
      responses:
        '201':
          description: History point created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPoint'
  /history/ohlc:
    get:
      tags: [History]
      summary: Get OHLC candles of portfolio value or profit and loss
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month, 6months, year, all]
            default: 6months
        - name: metric
          in: query
          required: false
          schema:
            type: string
            enum: [value, pnl]
            default: value
      responses:
        '200':
          description: Candles, chained so each open equals the previous close
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OhlcCandle'
  /history/fill-gaps:
    post:
      tags: [History]
      summary: Recompute history points across gaps
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                interval:
                  type: string
                  enum: [1h, 1d]
                  default: 1d
                from:
                  type: integer
                  description: Start timestamp in milliseconds; defaults to the first trade
                to:
                  type: integer
                  description: End timestamp in milliseconds; defaults to now
      responses:
        '200':
          description: Counts of inserted and skipped points
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryFillGapsResult'
        '400':
          description: interval must be 1h or 1d
  /history/{id}:
    delete:
      tags: [History]
      summary: Delete a history point by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /alerts:
    get:
      tags: [Alerts]
      summary: Get all alerts
      responses:
        '200':
          description: Alerts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'
    post:
      tags: [Alerts]
      summary: Create a new alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertCreate'
      responses:
        '201':
          description: Alert created
          content:
            application/json:
              schema:
                type: object
                properties:
                  alert:
                    $ref: '#/components/schemas/Alert'
  /alerts/triggered:
    get:
      tags: [Alerts]
      summary: Get triggered alerts
      responses:
        '200':
          description: Triggered alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TriggeredAlert'
  /alerts/{id}:
    put:
      tags: [Alerts]
      summary: Update an alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertUpdate'
      responses:
        '200':
          description: Alert updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  alert:
                    $ref: '#/components/schemas/Alert'
    delete:
      tags: [Alerts]
      summary: Delete an alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /alerts/dismiss/{triggeredAlertId}:
    post:
      tags: [Alerts]
      summary: Dismiss a triggered alert
      parameters:
        - name: triggeredAlertId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dismissed alert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggeredAlert'
  /alerts/test-notify:
    post:
      tags: [Alerts]
      summary: Send a test notification
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                message:
                  type: string
      responses:
        '200':
          description: Test notification sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
  /config/symbols:
    get:
      tags: [Config]
      summary: Get available symbol configuration
      responses:
        '200':
          description: Symbols list
          content:
            application/json:
              schema:
                type: object
                properties:
                  all:
                    type: array
                    items:
                      type: string
                  crypto:
                    type: array
                    items:
                      type: string
                  stocks:
                    type: array
                    items:
                      type: string
                  currencies:
                    type: array
                    items:
                      type: string
                  detailed:
                    type: object
                    additionalProperties:
                      type: object
  /config/symbols/{symbol}:
    get:
      tags: [Config]
      summary: Get configuration for a specific symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Symbol config
          content:
            application/json:
              schema:
                type: object
  /scenarios:
    get:
      tags: [Scenarios]
      summary: List saved scenarios
      responses:
        '200':
          description: Scenario list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScenarioSummary'
    post:
      tags: [Scenarios]
      summary: Create a new scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioCreate'
      responses:
        '201':
          description: Scenario created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioSummary'
  /scenarios/{id}:
    get:
      tags: [Scenarios]
      summary: Get scenario details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scenario detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioDetail'
    put:
      tags: [Scenarios]
      summary: Update an existing scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioCreate'
      responses:
        '200':
          description: Scenario updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioSummary'
    delete:
      tags: [Scenarios]
      summary: Delete a scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scenario deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /analytics:
    get:
      tags: [Analytics]
      summary: Get the latest analytics snapshot per period
      responses:
        '200':
          description: Snapshots ordered by period
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnalyticsSnapshot'
  /health:
    get:
      tags: [Health]
      summary: Server health
      responses:
        '200':
          description: Health info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: The database could not be read — the container healthcheck fails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthFailure'
  /trades:
    get:
      tags: [Trades]
      summary: List trades
      responses:
        '200':
          description: All trades, ordered by execution time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trade'
    post:
      tags: [Trades]
      summary: Add a trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Trade'
      responses:
        '201':
          description: Trade created
  /trades/{id}:
    delete:
      tags: [Trades]
      summary: Delete trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /migrations/backfill-prices:
    post:
      tags: [Migrations]
      summary: Backfill about two years of daily closes into price_ticks
      description: >
        Calls Yahoo Finance for every configured symbol with an 800 ms pause
        between symbols, so the request takes roughly 30 seconds.
      responses:
        '200':
          description: Per-symbol insert counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  totalInserted:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        inserted:
                          type: integer
                        fetched:
                          type: integer
                        status:
                          type: string
        '500':
          description: Backfill failed
  /migrations/backfill-cash:
    post:
      tags: [Migrations]
      summary: Rebuild the cash ledger from portfolio snapshots
      description: >
        Clears every existing cash entry before inserting the derived deltas.
        Run backfill-prices first, otherwise there are no prices to subtract.
      responses:
        '200':
          description: Counts for the backfill, or an explanatory error
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  snapshotsTotal:
                    type: integer
                  sampled:
                    type: integer
                  estimated:
                    type: integer
                  inserted:
                    type: integer
                  error:
                    type: string
  /sql/tables:
    get:
      tags: [SQL Explorer]
      summary: List tables in the database
      parameters:
        - name: db
          in: query
          required: false
          schema:
            type: string
            enum: [portfolio]
            default: portfolio
      responses:
        '200':
          description: Table names
          content:
            application/json:
              schema:
                type: object
                properties:
                  tables:
                    type: array
                    items:
                      type: string
        '400':
          description: Unknown database
  /sql/schema:
    get:
      tags: [SQL Explorer]
      summary: List the columns of a table
      parameters:
        - name: db
          in: query
          required: false
          schema:
            type: string
            enum: [portfolio]
            default: portfolio
        - name: table
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Column definitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  columns:
                    type: array
                    items:
                      type: object
        '400':
          description: Missing table parameter or unknown database
  /sql/query:
    post:
      tags: [SQL Explorer]
      summary: Run a single statement
      description: >
        SELECT statements are returned as rows; anything else is executed as a
        write. The endpoint is unauthenticated and answers 403 unless
        ENABLE_SQL_EXPLORER=true, which is off by default — including in the
        Docker image.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SqlQueryRequest'
      responses:
        '200':
          description: Query result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SqlQueryResult'
        '400':
          description: Missing sql field, unknown database, or rejected statement
components:
  schemas:
    Trade:
      type: object
      properties:
        id:
          type: string
        symbol:
          type: string
        side:
          type: string
          enum: [buy, sell]
        qty:
          type: number
        price:
          type: number
        time:
          type: string
          format: date-time
    HistoryPoint:
      type: object
      properties:
        id:
          type: string
        t:
          type: string
        ts:
          type: integer
        v:
          type: number
        i:
          type: number
        p:
          type: number
        manual:
          type: boolean
        note:
          type: string
    CashPositions:
      type: object
      properties:
        cashReais:
          type: number
        cashDollars:
          type: number
        interestReais:
          type: number
        interestDollars:
          type: number
    InterestMonth:
      type: object
      properties:
        month:
          type: string
        amount:
          type: number
    StateResponse:
      type: object
      properties:
        trades:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
        history:
          type: array
          items:
            $ref: '#/components/schemas/HistoryPoint'
        interestReaisMonths:
          type: array
          items:
            $ref: '#/components/schemas/InterestMonth'
        cashReais:
          type: number
        cashDollars:
          type: number
        interestReais:
          type: number
        interestDollars:
          type: number
    StateImportPayload:
      type: object
      properties:
        trades:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
        history:
          type: array
          items:
            $ref: '#/components/schemas/HistoryPoint'
        interestReaisMonths:
          type: array
          items:
            $ref: '#/components/schemas/InterestMonth'
        cashReais:
          type: number
        cashDollars:
          type: number
        interestReais:
          type: number
        interestDollars:
          type: number
    AssetHistory:
      type: object
      properties:
        symbol:
          type: string
        labels:
          type: array
          items:
            type: string
        prices:
          type: array
          items:
            type: number
        ts:
          type: integer
    Alert:
      type: object
      properties:
        id:
          type: string
        symbol:
          type: string
        alert_type:
          type: string
          enum: [value, percentage]
        threshold:
          type: number
        condition:
          type: string
          enum: [above, below]
        reference_price:
          type: number
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: integer
    AlertCreate:
      type: object
      required: [symbol, alert_type, threshold, condition]
      properties:
        symbol:
          type: string
        alert_type:
          type: string
          enum: [value, percentage]
        threshold:
          type: number
        condition:
          type: string
          enum: [above, below]
        reference_price:
          type: number
    AlertUpdate:
      type: object
      properties:
        symbol:
          type: string
        alert_type:
          type: string
          enum: [value, percentage]
        threshold:
          type: number
        condition:
          type: string
          enum: [above, below]
        reference_price:
          type: number
          nullable: true
        is_active:
          type: boolean
    TriggeredAlert:
      type: object
      properties:
        id:
          type: string
        alert_id:
          type: string
        triggered_at:
          type: integer
        is_dismissed:
          type: boolean
        dismissed_at:
          type: integer
          nullable: true
        alert_type:
          type: string
        threshold:
          type: number
        condition:
          type: string
    ScenarioSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: integer
        updatedAt:
          type: integer
    ScenarioDetail:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        data:
          type: object
        createdAt:
          type: integer
        updatedAt:
          type: integer
    ScenarioCreate:
      type: object
      required: [name, data]
      properties:
        name:
          type: string
        data:
          type: object
    CashEntry:
      type: object
      properties:
        id:
          type: string
        currency:
          type: string
          enum: [BRL, USD]
        amount:
          type: number
          description: Signed amount; negative for outflows
        description:
          type: string
        ts:
          type: integer
          description: Unix timestamp in milliseconds
    CashEntryCreate:
      type: object
      required: [currency, amount]
      properties:
        currency:
          type: string
          enum: [BRL, USD]
        amount:
          type: number
          description: Non-zero signed amount
        description:
          type: string
        ts:
          type: integer
          description: Unix timestamp in milliseconds; defaults to now
    CashTotals:
      type: object
      description: Re-summed cash ledger totals
      properties:
        cashReais:
          type: number
        cashDollars:
          type: number
    OhlcCandle:
      type: object
      properties:
        ts:
          type: integer
          description: Bucket start in milliseconds
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
    HistoryFillGapsResult:
      type: object
      properties:
        inserted:
          type: integer
        skipped:
          type: integer
        errors:
          type: integer
        from:
          type: integer
        to:
          type: integer
    AnalyticsSnapshot:
      type: object
      properties:
        id:
          type: string
        computed_at:
          type: integer
        period:
          type: string
        return_pct:
          type: number
          nullable: true
