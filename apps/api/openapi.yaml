openapi: 3.0.3
info:
  title: Portfolio Dashboard API
  version: '0.1.0'
  description: Minimal API for the portfolio dashboard (LAN deployment)
servers:
  - url: http://localhost:3000/api
tags:
  - name: State
    description: App state endpoints
  - name: Health
    description: Health and diagnostics endpoints
  - name: Trades
    description: Trade management endpoints
  - name: History
    description: History point endpoints
  - name: Cash
    description: Cash position endpoints
  - name: Interest
    description: Interest month endpoints
  - name: Prices
    description: Price data endpoints
  - name: Asset
    description: Asset history endpoints
  - name: Alerts
    description: Alert endpoints
  - name: Config
    description: Configuration endpoints
  - name: Scenarios
    description: Scenario persistence endpoints
  - name: Analytics
    description: Analytics snapshot endpoints
  - name: Portfolio
    description: Server-computed portfolio values
  - name: SQL Explorer
    description: Read-only SQL console endpoints
paths:
  /state/export:
    get:
      tags: [State]
      summary: Export full app state as JSON
      description: |
        The application\'s only backup. Carries every table that cannot be
        re-derived: trades, portfolio_snapshots (including brlusd_rate), interest,
        cash, alerts, scenarios, price_cache, asset_chart_cache and
        analytics_snapshots. Excludes price_ticks, which is refetched from Yahoo
        and is 28 MB of the file - including it would exceed the body limit the
        import imposes. __drizzle_migrations is excluded so a restore cannot
        claim a migration history it does not have.
      responses:
        '200':
          description: Exported app state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateExport'
  /state/import:
    post:
      tags: [State]
      summary: Restore app state from a JSON backup
      description: |
        Replaces, it does not merge. Every table the payload carries is cleared
        before it is written, so a row absent from the backup is removed - which
        is what makes restoring an older backup able to undo a later mistake. A
        key that is absent or not an array leaves its table untouched, so a
        partial payload cannot empty a table. All of it runs in one transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateImportPayload'
      responses:
        '200':
          description: Imported app state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /cash:
    get:
      tags: [Cash]
      summary: Get cash positions
      responses:
        '200':
          description: Cash positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashPositions'
    put:
      tags: [Cash]
      summary: Update cash positions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashPositions'
      responses:
        '200':
          description: Updated cash positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashPositions'
  /cash/entries:
    get:
      tags: [Cash]
      summary: List cash ledger entries
      responses:
        '200':
          description: Cash entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CashEntry'
    post:
      tags: [Cash]
      summary: Append a cash ledger entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashEntryCreate'
      responses:
        '201':
          description: Entry created, with recomputed totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry:
                    $ref: '#/components/schemas/CashEntry'
                  totals:
                    $ref: '#/components/schemas/CashTotals'
        '400':
          description: currency must be BRL or USD, amount must be a non-zero number
  /cash/entries/{id}:
    delete:
      tags: [Cash]
      summary: Delete a cash ledger entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entry deleted, with recomputed totals
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  totals:
                    $ref: '#/components/schemas/CashTotals'
  /interest/months:
    get:
      tags: [Interest]
      summary: List interest months
      parameters:
        - name: currency
          in: query
          required: false
          schema:
            type: string
            enum: [BRL, USD]
          description: Restrict to one currency; omit to get both ledgers, each row carrying its own `currency`
      responses:
        '200':
          description: Interest months
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InterestMonth'
    post:
      tags: [Interest]
      summary: Add or replace interest month
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestMonth'
      responses:
        '201':
          description: Added interest month
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestMonth'
  /interest/months/{month}:
    delete:
      tags: [Interest]
      summary: Delete an interest month
      parameters:
        - name: month
          in: path
          required: true
          schema:
            type: string
        - name: currency
          in: query
          required: false
          schema:
            type: string
            enum: [BRL, USD]
            default: BRL
          description: Which interest row to delete; months are keyed by currency
      responses:
        '204':
          description: Deleted
  /prices:
    get:
      tags: [Prices]
      summary: Get cached prices
      responses:
        '200':
          description: Current cached prices
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: number
  /asset/{symbol}/history:
    get:
      tags: [Asset]
      summary: Get historical price data for an asset symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 60
      responses:
        '200':
          description: Asset history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetHistory'
  /asset/{symbol}/ohlc:
    get:
      tags: [Asset]
      summary: Get OHLC candles for an asset symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          required: false
          description: Lookback window in days; values above 1825 are capped
          schema:
            type: integer
            default: 60
      responses:
        '200':
          description: Candles bucketed to 4h, 1d or 7d depending on the window
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OhlcCandle'
        '400':
          description: Invalid days parameter
  /history:
    get:
      tags: [History]
      summary: Get history points, optional range filter
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month, 6months, year, all]
            default: all
      responses:
        '200':
          description: History points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryPoint'
  /history/point:
    post:
      tags: [History]
      summary: Add a history point
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoryPoint'
      responses:
        '201':
          description: History point created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPoint'
  /history/ohlc:
    get:
      tags: [History]
      summary: Get OHLC candles of portfolio value or profit and loss
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month, 6months, year, all]
            default: 6months
        - name: metric
          in: query
          required: false
          schema:
            type: string
            enum: [value, pnl]
            default: value
      responses:
        '200':
          description: Candles, chained so each open equals the previous close
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OhlcCandle'
  /history/fill-gaps:
    post:
      tags: [History]
      summary: Recompute history points across gaps
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                interval:
                  type: string
                  enum: [1h, 1d]
                  default: 1d
                from:
                  type: integer
                  description: Start timestamp in milliseconds; defaults to the first trade
                to:
                  type: integer
                  description: End timestamp in milliseconds; defaults to now
      responses:
        '200':
          description: Counts of inserted and skipped points
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryFillGapsResult'
        '400':
          description: interval must be 1h or 1d
  /history/{id}:
    delete:
      tags: [History]
      summary: Delete a history point by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /alerts:
    get:
      tags: [Alerts]
      summary: Get all alerts
      responses:
        '200':
          description: Alerts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'
    post:
      tags: [Alerts]
      summary: Create a new alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertCreate'
      responses:
        '201':
          description: Alert created
          content:
            application/json:
              schema:
                type: object
                properties:
                  alert:
                    $ref: '#/components/schemas/Alert'
  /alerts/triggered:
    get:
      tags: [Alerts]
      summary: Get triggered alerts
      responses:
        '200':
          description: Triggered alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TriggeredAlert'
  /alerts/{id}:
    put:
      tags: [Alerts]
      summary: Update an alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertUpdate'
      responses:
        '200':
          description: Alert updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  alert:
                    $ref: '#/components/schemas/Alert'
    delete:
      tags: [Alerts]
      summary: Delete an alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /alerts/dismiss/{triggeredAlertId}:
    post:
      tags: [Alerts]
      summary: Dismiss a triggered alert
      parameters:
        - name: triggeredAlertId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dismissed alert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggeredAlert'
  /alerts/test-notify:
    post:
      tags: [Alerts]
      summary: Send a test notification
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                message:
                  type: string
      responses:
        '200':
          description: Test notification sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
  /config/symbols:
    get:
      tags: [Config]
      summary: Get available symbol configuration
      responses:
        '200':
          description: Symbols list
          content:
            application/json:
              schema:
                type: object
                properties:
                  all:
                    type: array
                    items:
                      type: string
                  crypto:
                    type: array
                    items:
                      type: string
                  stocks:
                    type: array
                    items:
                      type: string
                  currencies:
                    type: array
                    items:
                      type: string
                  detailed:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/SymbolConfig'
  /config/symbols/{symbol}:
    get:
      tags: [Config]
      summary: Get configuration for a specific symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Symbol config
          content:
            application/json:
              schema:
                type: object
  /scenarios:
    get:
      tags: [Scenarios]
      summary: List saved scenarios
      responses:
        '200':
          description: Scenario list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScenarioSummary'
    post:
      tags: [Scenarios]
      summary: Create a new scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioCreate'
      responses:
        '201':
          description: Scenario created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioSummary'
  /scenarios/{id}:
    get:
      tags: [Scenarios]
      summary: Get scenario details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scenario detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioDetail'
    put:
      tags: [Scenarios]
      summary: Update an existing scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioCreate'
      responses:
        '200':
          description: Scenario updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioSummary'
    delete:
      tags: [Scenarios]
      summary: Delete a scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scenario deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /analytics:
    get:
      tags: [Analytics]
      summary: Get the latest analytics snapshot per period
      responses:
        '200':
          description: Snapshots ordered by period
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshots:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnalyticsSnapshot'
  /portfolio/valuation:
    get:
      tags: [Portfolio]
      summary: Portfolio totals, invested cost, per-position P/L and allocation split
      description: >
        The derived values of the whole portfolio, computed server-side by
        packages/shared so the dashboard and the history the API has already
        written cannot disagree. Amounts are plain numbers; each row states the
        currency it is denominated in.
      parameters:
        - name: cash
          in: query
          required: false
          description: Whether the allocation split includes the cash balances
          schema:
            type: string
            enum: [with-cash, investments]
            default: with-cash
      responses:
        '200':
          description: The current valuation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioValuation'
        '500':
          description: The valuation could not be computed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /health:
    get:
      tags: [Health]
      summary: Server health
      responses:
        '200':
          description: Health info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: The database could not be read — the container healthcheck fails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthFailure'
  /trades:
    get:
      tags: [Trades]
      summary: List trades
      responses:
        '200':
          description: All trades, ordered by execution time
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trade'
    post:
      tags: [Trades]
      summary: Add a trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradeCreate'
      responses:
        '201':
          description: Trade created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeCreateResponse'
  /trades/{id}:
    delete:
      tags: [Trades]
      summary: Delete trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /sql/tables:
    get:
      tags: [SQL Explorer]
      summary: List tables in the database
      parameters:
        - name: db
          in: query
          required: false
          schema:
            type: string
            enum: [portfolio]
            default: portfolio
      responses:
        '200':
          description: Table names
          content:
            application/json:
              schema:
                type: object
                properties:
                  tables:
                    type: array
                    items:
                      type: string
        '400':
          description: Unknown database
  /sql/schema:
    get:
      tags: [SQL Explorer]
      summary: List the columns of a table
      parameters:
        - name: db
          in: query
          required: false
          schema:
            type: string
            enum: [portfolio]
            default: portfolio
        - name: table
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Column definitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  columns:
                    type: array
                    items:
                      type: object
        '400':
          description: Missing table parameter or unknown database
  /sql/query:
    post:
      tags: [SQL Explorer]
      summary: Run a single statement
      description: >
        SELECT statements are returned as rows; anything else is executed as a
        write. The endpoint is unauthenticated and answers 403 unless
        ENABLE_SQL_EXPLORER=true, which is off by default — including in the
        Docker image.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SqlQueryRequest'
      responses:
        '200':
          description: Query result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SqlQueryResult'
        '400':
          description: Missing sql field, unknown database, or rejected statement
components:
  schemas:
    Trade:
      type: object
      properties:
        id:
          type: string
        symbol:
          type: string
        side:
          type: string
          enum: [buy, sell]
        qty:
          type: number
        price:
          type: number
        time:
          type: string
          format: date-time
        profit:
          type: number
          description: >-
            Realized P/L this sell booked, in the symbol's own currency. Derived
            by the server from the FIFO walk on every read, not stored: the
            `trades.profit` column was dropped in migration 0003. Present on
            sells only, and 0 for a sell with no lot behind it.
    HistoryPoint:
      type: object
      properties:
        id:
          type: string
        t:
          type: string
        ts:
          type: integer
        v:
          type: number
        i:
          type: number
        p:
          type: number
        manual:
          type: boolean
        note:
          type: string
        brlusd_rate:
          type: number
          nullable: true
          description: FX rate captured with the snapshot; NULL for rows written before the column existed
    CashPositions:
      type: object
      properties:
        cashReais:
          type: number
        cashDollars:
          type: number
        interestReais:
          type: number
        interestDollars:
          type: number
    InterestMonth:
      type: object
      properties:
        month:
          type: string
        amount:
          type: number
        currency:
          type: string
          enum: [BRL, USD]
          description: Which ledger the row belongs to; present when both are listed at once
    StateExport:
      type: object
      description: |
        The application\'s only backup. Every table that cannot be re-derived,
        except price_ticks, which is refetched from Yahoo and would push the
        payload past the 10 MB body limit the import accepts.
      properties:
        formatVersion:
          type: integer
          description: Payload shape version. Absent in backups taken before the caches were added.
        trades:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
        history:
          type: array
          items:
            $ref: '#/components/schemas/HistoryPoint'
        cashEntries:
          type: array
          items:
            $ref: '#/components/schemas/CashEntry'
        interestReaisMonths:
          type: array
          items:
            $ref: '#/components/schemas/InterestMonth'
        interestDollarsMonths:
          type: array
          items:
            $ref: '#/components/schemas/InterestMonth'
        cashReais:
          type: number
        cashDollars:
          type: number
        interestReais:
          type: number
        interestDollars:
          type: number
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        scenarios:
          type: array
          items:
            type: object
            additionalProperties: true
        priceCache:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Current prices, so a restore does not value every position at zero.
        assetChartCache:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Cached chart series per symbol and window.
        analyticsSnapshots:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Precomputed analytics, so the page is not blank until the daily job.
    StateImportPayload:
      type: object
      description: |
        A backup produced by /state/export. Every array present is treated as the
        complete contents of its table and replaces what is there; a key that is
        absent leaves its table untouched.
      properties:
        formatVersion:
          type: integer
        trades:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
        history:
          type: array
          items:
            $ref: '#/components/schemas/HistoryPoint'
        interestReaisMonths:
          type: array
          items:
            $ref: '#/components/schemas/InterestMonth'
        interestDollarsMonths:
          type: array
          items:
            $ref: '#/components/schemas/InterestMonth'
        cashEntries:
          type: array
          items:
            $ref: '#/components/schemas/CashEntry'
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        scenarios:
          type: array
          items:
            type: object
            additionalProperties: true
        priceCache:
          type: array
          items:
            type: object
            additionalProperties: true
        assetChartCache:
          type: array
          items:
            type: object
            additionalProperties: true
        analyticsSnapshots:
          type: array
          items:
            type: object
            additionalProperties: true
        cashReais:
          type: number
        cashDollars:
          type: number
        interestReais:
          type: number
        interestDollars:
          type: number
    AssetHistory:
      type: object
      properties:
        symbol:
          type: string
        labels:
          type: array
          items:
            type: string
        prices:
          type: array
          items:
            type: number
        ts:
          type: integer
    Alert:
      type: object
      properties:
        id:
          type: string
        symbol:
          type: string
        alert_type:
          type: string
          enum: [value, percentage]
        threshold:
          type: number
        condition:
          type: string
          enum: [above, below]
        reference_price:
          type: number
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: integer
    AlertCreate:
      type: object
      required: [symbol, alert_type, threshold, condition]
      properties:
        symbol:
          type: string
        alert_type:
          type: string
          enum: [value, percentage]
        threshold:
          type: number
        condition:
          type: string
          enum: [above, below]
        reference_price:
          type: number
    AlertUpdate:
      type: object
      properties:
        symbol:
          type: string
        alert_type:
          type: string
          enum: [value, percentage]
        threshold:
          type: number
        condition:
          type: string
          enum: [above, below]
        reference_price:
          type: number
          nullable: true
        is_active:
          type: boolean
    TriggeredAlert:
      type: object
      properties:
        id:
          type: string
        alert_id:
          type: string
        symbol:
          type: string
        alert_type:
          type: string
        threshold:
          type: number
        condition:
          type: string
        triggered_at:
          type: integer
        is_dismissed:
          type: boolean
        dismissed_at:
          type: integer
          nullable: true
        current_price:
          type: number
          nullable: true
        previous_price:
          type: number
          nullable: true
        percentage_change:
          type: number
          nullable: true
    TradeCreate:
      allOf:
        - $ref: '#/components/schemas/Trade'
        - type: object
          properties:
            cashSource:
              type: string
              enum: [USD, BRL]
              description: Which cash balance the trade is settled against
    TradeCreateResponse:
      type: object
      properties:
        trade:
          $ref: '#/components/schemas/Trade'
        cashEntry:
          allOf:
            - $ref: '#/components/schemas/CashEntry'
    SymbolConfig:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [crypto, stock, currency]
        coingeckoId:
          type: string
        yahooTicker:
          type: string
        historicalFallbacks:
          type: array
          items:
            type: string
        denominatedInBRL:
          type: boolean
          description: Price and value are natively in BRL, not USD
    ScenarioSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: integer
        updatedAt:
          type: integer
    ScenarioDetail:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        data:
          type: object
        createdAt:
          type: integer
        updatedAt:
          type: integer
    ScenarioCreate:
      type: object
      required: [name, data]
      properties:
        name:
          type: string
        data:
          type: object
          additionalProperties: true
          description: |
            Simulator blob. Its shape is owned by apps/web, not by the API:
            { version, simPrices, simPricePcts, simTrades, simCashReais,
              simCashDollars }. Stored verbatim and handed back unchanged.
    CashEntry:
      type: object
      properties:
        id:
          type: string
        currency:
          type: string
          enum: [BRL, USD]
        amount:
          type: number
          description: Signed amount; negative for outflows
        description:
          type: string
        ts:
          type: integer
          description: Unix timestamp in milliseconds
    CashEntryCreate:
      type: object
      required: [currency, amount]
      properties:
        currency:
          type: string
          enum: [BRL, USD]
        amount:
          type: number
          description: Non-zero signed amount
        description:
          type: string
        ts:
          type: integer
          description: Unix timestamp in milliseconds; defaults to now
    CashTotals:
      type: object
      description: Re-summed cash ledger totals
      properties:
        cashReais:
          type: number
        cashDollars:
          type: number
    OhlcCandle:
      type: object
      properties:
        ts:
          type: integer
          description: Bucket start in milliseconds
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
    HistoryFillGapsResult:
      type: object
      properties:
        inserted:
          type: integer
        skipped:
          type: integer
        errors:
          type: integer
        from:
          type: integer
        to:
          type: integer
    PortfolioValuation:
      type: object
      description: >
        Totals are in USD. `rows` covers every open position plus the two cash
        rows; each row says which currency its amounts are in, and `plCurrency`
        differs from `valueCurrency` for the BRL cash row because interest on a
        BRL balance is a BRL amount.
      required:
        - total
        - invested
        - investedNet
        - realized
        - unrealized
        - unrealizedPct
        - tickerValue
        - investedPct
        - breakEven
        - rows
        - allocation
        - plByAsset
        - brlUsdRate
        - salesCount
      properties:
        lots:
          type: object
          description: Open FIFO lots per symbol
          additionalProperties:
            type: array
            items:
              type: object
              required: [qty, price]
              properties:
                qty:
                  type: number
                price:
                  type: number
        positions:
          type: object
          description: Open quantity per symbol
          additionalProperties:
            type: number
        total:
          type: number
          description: Holdings at market value plus both cash balances
        invested:
          type: number
          description: Cost basis of open lots plus both cash balances
        investedNet:
          type: number
        realized:
          type: number
          description: Realized P/L from sells plus interest earned
        unrealized:
          type: number
        unrealizedPct:
          type: number
        tickerValue:
          type: number
          description: Market value of the tickers only — excludes cash and BRLUSD
        investedPct:
          type: number
        breakEven:
          type: boolean
        rows:
          type: array
          items:
            type: object
            required: [symbol, kind, qty, avgCost, currentPrice, value, pl, plPct, valueCurrency, plCurrency]
            properties:
              symbol:
                type: string
              kind:
                type: string
                enum: [position, brl-cash, usd-cash]
              qty:
                type: number
              avgCost:
                type: number
              currentPrice:
                type: number
              value:
                type: number
              pl:
                type: number
              plPct:
                type: number
              valueCurrency:
                type: string
                enum: [BRL, USD]
              plCurrency:
                type: string
                enum: [BRL, USD]
              quotedInBrl:
                type: boolean
        allocation:
          type: array
          items:
            type: object
            required: [label, value, pct]
            properties:
              label:
                type: string
              value:
                type: number
              pct:
                type: number
        plByAsset:
          type: array
          items:
            type: object
            required: [symbol, pl]
            properties:
              symbol:
                type: string
              pl:
                type: number
        brlUsdRate:
          type: number
        salesCount:
          type: integer
          description: Trades with side `sell` — the "from N sales" count
    AnalyticsSnapshot:
      type: object
      properties:
        id:
          type: string
        computed_at:
          type: integer
        period:
          type: string
        return_pct:
          type: number
          nullable: true
        max_drawdown_pct:
          type: number
          nullable: true
        max_drawdown_start:
          type: integer
          nullable: true
        max_drawdown_end:
          type: integer
          nullable: true
        sharpe_ratio:
          type: number
          nullable: true
        allocation_json:
          type: string
          nullable: true
        cost_vs_market_json:
          type: string
          nullable: true
        return_inputs:
          type: object
          nullable: true
          description: Inputs behind return_pct, so the UI can show the formula
          properties:
            start_ts:
              type: integer
            end_ts:
              type: integer
            start_invested:
              type: number
            start_pnl:
              type: number
            end_pnl:
              type: number
            interest_period_usd:
              type: number
            numerator_usd:
              type: number
        drawdown_inputs:
          type: object
          nullable: true
          description: Inputs behind max_drawdown_pct, so the UI can show the formula
          properties:
            series:
              type: string
            points_count:
              type: integer
            peak_ts:
              type: integer
            trough_ts:
              type: integer
            peak_value:
              type: number
            trough_value:
              type: number
        sharpe_inputs:
          type: object
          nullable: true
          description: Inputs behind sharpe_ratio, so the UI can show the formula
          properties:
            observations:
              type: integer
            mean_return:
              type: number
            std_return:
              type: number
            periods_per_year:
              type: number
            rf_per_period:
              type: number
    SqlQueryRequest:
      type: object
      required: [sql]
      properties:
        sql:
          type: string
        db:
          type: string
          enum: [portfolio]
          default: portfolio
    SqlQueryResult:
      type: object
      properties:
        type:
          type: string
          enum: [select, write]
        rows:
          type: array
          items:
            type: object
          description: Present when type is select
        columns:
          type: array
          items:
            type: string
        rowCount:
          type: integer
        lastInsertRowid:
          description: Present when type is write
        message:
          type: string
          description: Present when type is write
    HealthStatus:
      type: object
      properties:
        ok:
          type: boolean
        uptime:
          type: number
          description: Process uptime in seconds
        lastPriceFetch:
          type: integer
          nullable: true
          description: Newest `price_cache` timestamp, Unix ms
        lastAssetHistory:
          type: integer
          nullable: true
          description: Newest `asset_chart_cache` timestamp, Unix ms
        dbFile:
          type: string
          nullable: true
    HealthFailure:
      type: object
      properties:
        ok:
          type: boolean
        uptime:
          type: number
        error:
          type: string
          description: Why the database read failed
