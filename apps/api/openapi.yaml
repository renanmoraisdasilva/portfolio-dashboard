openapi: 3.0.3
info:
  title: Portfolio Dashboard API
  version: '0.1.0'
  description: Minimal API for the portfolio dashboard (LAN deployment)
servers:
  - url: http://localhost:3000/api
tags:
  - name: State
    description: App state endpoints
  - name: Health
    description: Health and diagnostics endpoints
  - name: Trades
    description: Trade management endpoints
  - name: History
    description: History point endpoints
  - name: Cash
    description: Cash position endpoints
  - name: Interest
    description: Interest month endpoints
  - name: Prices
    description: Price data endpoints
  - name: Asset
    description: Asset history endpoints
  - name: Alerts
    description: Alert endpoints
  - name: Config
    description: Configuration endpoints
  - name: Scenarios
    description: Scenario persistence endpoints
paths:
  /state:
    get:
      tags: [State]
      summary: Get full app state
      responses:
        '200':
          description: App state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateResponse'
    delete:
      tags: [State]
      summary: Erase all app state data
      responses:
        '204':
          description: State erased
  /state/export:
    get:
      tags: [State]
      summary: Export full app state as JSON
      responses:
        '200':
          description: Exported app state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateResponse'
  /state/import:
    post:
      tags: [State]
      summary: Import app state JSON payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateImportPayload'
      responses:
        '200':
          description: Imported app state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /cash:
    get:
      tags: [Cash]
      summary: Get cash positions
      responses:
        '200':
          description: Cash positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashPositions'
    put:
      tags: [Cash]
      summary: Update cash positions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashPositions'
      responses:
        '200':
          description: Updated cash positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashPositions'
  /interest/months:
    get:
      tags: [Interest]
      summary: List interest months
      responses:
        '200':
          description: Interest months
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InterestMonth'
    post:
      tags: [Interest]
      summary: Add or replace interest month
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestMonth'
      responses:
        '201':
          description: Added interest month
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestMonth'
  /interest/months/{month}:
    delete:
      tags: [Interest]
      summary: Delete an interest month
      parameters:
        - name: month
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /prices:
    get:
      tags: [Prices]
      summary: Get cached prices
      responses:
        '200':
          description: Current cached prices
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: number
  /asset/{symbol}/history:
    get:
      tags: [Asset]
      summary: Get historical price data for an asset symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 60
      responses:
        '200':
          description: Asset history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetHistory'
  /history:
    get:
      tags: [History]
      summary: Get history points, optional range filter
      parameters:
        - name: range
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month, 6months, year, all]
            default: all
      responses:
        '200':
          description: History points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HistoryPoint'
    delete:
      tags: [History]
      summary: Clear all history points
      responses:
        '204':
          description: All history points cleared
  /history/point:
    post:
      tags: [History]
      summary: Add a history point
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HistoryPoint'
      responses:
        '201':
          description: History point created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPoint'
  /history/{id}:
    delete:
      tags: [History]
      summary: Delete a history point by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /alerts:
    get:
      tags: [Alerts]
      summary: Get all alerts
      responses:
        '200':
          description: Alerts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'
    post:
      tags: [Alerts]
      summary: Create a new alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertCreate'
      responses:
        '201':
          description: Alert created
          content:
            application/json:
              schema:
                type: object
                properties:
                  alert:
                    $ref: '#/components/schemas/Alert'
  /alerts/triggered:
    get:
      tags: [Alerts]
      summary: Get triggered alerts
      responses:
        '200':
          description: Triggered alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TriggeredAlert'
  /alerts/{id}:
    put:
      tags: [Alerts]
      summary: Update an alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertUpdate'
      responses:
        '200':
          description: Alert updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  alert:
                    $ref: '#/components/schemas/Alert'
    delete:
      tags: [Alerts]
      summary: Delete an alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /alerts/dismiss/{triggeredAlertId}:
    post:
      tags: [Alerts]
      summary: Dismiss a triggered alert
      parameters:
        - name: triggeredAlertId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dismissed alert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggeredAlert'
  /alerts/test-notify:
    post:
      tags: [Alerts]
      summary: Send a test notification
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                message:
                  type: string
      responses:
        '200':
          description: Test notification sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
  /config/symbols:
    get:
      tags: [Config]
      summary: Get available symbol configuration
      responses:
        '200':
          description: Symbols list
          content:
            application/json:
              schema:
                type: object
                properties:
                  all:
                    type: array
                    items:
                      type: string
                  crypto:
                    type: array
                    items:
                      type: string
                  stocks:
                    type: array
                    items:
                      type: string
                  currencies:
                    type: array
                    items:
                      type: string
                  detailed:
                    type: object
                    additionalProperties:
                      type: object
  /config/symbols/{symbol}:
    get:
      tags: [Config]
      summary: Get configuration for a specific symbol
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Symbol config
          content:
            application/json:
              schema:
                type: object
  /scenarios:
    get:
      tags: [Scenarios]
      summary: List saved scenarios
      responses:
        '200':
          description: Scenario list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScenarioSummary'
    post:
      tags: [Scenarios]
      summary: Create a new scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioCreate'
      responses:
        '201':
          description: Scenario created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioSummary'
  /scenarios/{id}:
    get:
      tags: [Scenarios]
      summary: Get scenario details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scenario detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioDetail'
    put:
      tags: [Scenarios]
      summary: Update an existing scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioCreate'
      responses:
        '200':
          description: Scenario updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioSummary'
    delete:
      tags: [Scenarios]
      summary: Delete a scenario
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scenario deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /health:
    get:
      tags: [Health]
      summary: Server health
      responses:
        '200':
          description: Health info
  /trades:
    post:
      tags: [Trades]
      summary: Add a trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Trade'
      responses:
        '201':
          description: Trade created
  /trades/{id}:
    delete:
      tags: [Trades]
      summary: Delete trade
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
components:
  schemas:
    Trade:
      type: object
      properties:
        id:
          type: string
        symbol:
          type: string
        side:
          type: string
          enum: [buy, sell]
        qty:
          type: number
        price:
          type: number
        time:
          type: string
          format: date-time
    HistoryPoint:
      type: object
      properties:
        id:
          type: string
        t:
          type: string
        ts:
          type: integer
        v:
          type: number
        i:
          type: number
        p:
          type: number
        manual:
          type: boolean
        note:
          type: string
    CashPositions:
      type: object
      properties:
        cashReais:
          type: number
        cashDollars:
          type: number
        interestReais:
          type: number
        interestDollars:
          type: number
    InterestMonth:
      type: object
      properties:
        month:
          type: string
        amount:
          type: number
    StateResponse:
      type: object
      properties:
        trades:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
        history:
          type: array
          items:
            $ref: '#/components/schemas/HistoryPoint'
        interestReaisMonths:
          type: array
          items:
            $ref: '#/components/schemas/InterestMonth'
        cashReais:
          type: number
        cashDollars:
          type: number
        interestReais:
          type: number
        interestDollars:
          type: number
    StateImportPayload:
      type: object
      properties:
        trades:
          type: array
          items:
            $ref: '#/components/schemas/Trade'
        history:
          type: array
          items:
            $ref: '#/components/schemas/HistoryPoint'
        interestReaisMonths:
          type: array
          items:
            $ref: '#/components/schemas/InterestMonth'
        cashReais:
          type: number
        cashDollars:
          type: number
        interestReais:
          type: number
        interestDollars:
          type: number
    AssetHistory:
      type: object
      properties:
        symbol:
          type: string
        labels:
          type: array
          items:
            type: string
        prices:
          type: array
          items:
            type: number
        ts:
          type: integer
    Alert:
      type: object
      properties:
        id:
          type: string
        symbol:
          type: string
        alert_type:
          type: string
          enum: [value, percentage]
        threshold:
          type: number
        condition:
          type: string
          enum: [above, below]
        reference_price:
          type: number
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: integer
    AlertCreate:
      type: object
      required: [symbol, alert_type, threshold, condition]
      properties:
        symbol:
          type: string
        alert_type:
          type: string
          enum: [value, percentage]
        threshold:
          type: number
        condition:
          type: string
          enum: [above, below]
        reference_price:
          type: number
    AlertUpdate:
      type: object
      properties:
        symbol:
          type: string
        alert_type:
          type: string
          enum: [value, percentage]
        threshold:
          type: number
        condition:
          type: string
          enum: [above, below]
        reference_price:
          type: number
          nullable: true
        is_active:
          type: boolean
    TriggeredAlert:
      type: object
      properties:
        id:
          type: string
        alert_id:
          type: string
        triggered_at:
          type: integer
        is_dismissed:
          type: boolean
        dismissed_at:
          type: integer
          nullable: true
        alert_type:
          type: string
        threshold:
          type: number
        condition:
          type: string
    ScenarioSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: integer
        updatedAt:
          type: integer
    ScenarioDetail:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        data:
          type: object
        createdAt:
          type: integer
        updatedAt:
          type: integer
    ScenarioCreate:
      type: object
      required: [name, data]
      properties:
        name:
          type: string
        data:
          type: object
